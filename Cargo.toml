[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/browserstack/rq"
authors = ["BrowserStack / Requestly"]
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"

# Optimize WASM/release builds for size (the npm/PyPI artifacts). Workspace-root so it applies
# to every member (Cargo ignores `[profile]` in non-root manifests).
[profile.release]
opt-level = "s"
lto = true

# Lints applied across every crate in the workspace.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
