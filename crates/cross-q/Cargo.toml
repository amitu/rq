[package]
name = "cross-q"
description = "Convert API-client collections between formats, through one idealised model."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cq"
path = "src/main.rs"

[lib]
name = "cross_q"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
# preserve_order: OpenAPI example bodies are synthesized from schema `properties`, and the app
# preserves that declaration order in the generated JSON — so cross-q must too (a BTreeMap would
# alphabetize the keys and diverge). Order-preserving Value flows through $ref deref + synthesis.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = "0.9"
clap.workspace = true
anyhow.workspace = true
cq-model = { path = "../cq-model" }
cq-report = { path = "../cq-report" }
rq-doc = { path = "../rq-doc" }

[dev-dependencies]
tempfile.workspace = true
rq-doc = { path = "../rq-doc" }
serde_json.workspace = true

[lints]
workspace = true
