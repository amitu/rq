[package]
name = "cross-q-context"
description = "The open-source rq.* scripting runtime — a QuickJS sandbox that runs pre-request / post-response scripts against the rq.* API (pm.*-compatible). Native crate, WASM (npm), and PyPI wheel from one core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rquickjs = { version = "0.9", features = ["classes", "properties"] }
cq-transform = { path = "../cq-transform" }

[lints]
workspace = true
