[package]
name = "cq-transform"
description = "The compat pillar of cross-q-context: an OXC-based AST rewrite of platform script dialects (Postman pm.*/postman.*, and Bruno bru.*) to the rq.* API. Scope-aware, byte-offset splices — comments and formatting preserved."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# rlib: consumed natively by cross-q-context. cdylib: wasm-pack build for @cross-q/context (npm).
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_parser = "0.60"
oxc_allocator = "0.60"
oxc_ast = "0.60"
oxc_span = "0.60"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
