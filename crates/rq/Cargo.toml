[package]
name = "rq"
description = "A better curl, powered by collections — the git-native terminal API client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rq"
path = "src/main.rs"

[lib]
name = "rq"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
# Maintained fork of the (archived) serde_yaml — the frontmatter reader/writer.
serde_norway = "0.9"
# The `-- view --` renderer. Jinja-compatible, pure Rust, no unsafe.
minijinja = { version = "2", features = ["loader"] }
# Response-body syntax highlighting. `default-fancy` swaps onig (a C library) for the pure-Rust
# fancy-regex engine — keeps the "pure Rust, no unsafe" posture.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Blocking HTTP with rustls. No async runtime: `rq r` is one request at a time.
ureq = { version = "3", features = ["json"] }
# Secret-shaped prompts read without echo.
rpassword = "7"
# Raw mode and key events for the post-run console. Drawing is ours — a layout library
# would be a large dependency for panes this plain.
crossterm = "0.29"
rquickjs = "0.12"
base64 = "0.23.1"
hex = "0.4.3"
sha1 = "0.11.0"
sha2 = "0.11.0"
md-5 = "0.11.0"
hmac = "0.13.0"
flate2 = "1.1.9"
uuid = { version = "1.24.1", features = ["v4"] }
getrandom = "0.4.3"
cq-transform = { version = "0.1.0", path = "../cq-transform" }
# Only to restore the default SIGPIPE handler — see `main`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# curl parsing + collection import, through the Idealised Model.
rq-doc = { path = "../rq-doc" }
cross-q = { path = "../cross-q" }
cq-model = { path = "../cq-model" }
cq-report = { path = "../cq-report" }

[dev-dependencies]
tempfile.workspace = true
# The example backend the example project runs against.
rq-testbed = { path = "../rq-testbed" }
crossterm = "0.29"

[lints]
workspace = true
